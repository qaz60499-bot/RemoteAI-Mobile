name: Build TrollStore IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remoteai-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "16.4"
  XCODE_BUILD: "16F6"
  IPHONEOS_SDK_VERSION: "18.5"
  IOS_SIM_RUNTIME: "com.apple.CoreSimulator.SimRuntime.iOS-18-5"
  DEVELOPER_DIR: "/Applications/Xcode_16.4.app/Contents/Developer"
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
  XCODEGEN_URL: "https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip"

jobs:
  build:
    name: Test + Device IPA
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, GitHub-verified release commit
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Security and protocol audit
        shell: bash
        run: bash scripts/security_audit.sh

      - name: Select pinned stable Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          [[ "$XCODE_APP" != *[Bb]eta* ]]
          test "$DEVELOPER_DIR" = "$XCODE_APP/Contents/Developer"
          test -d "$DEVELOPER_DIR"
          ACTUAL_XCODE_VERSION=$(xcodebuild -version | sed -n '1s/^Xcode //p')
          ACTUAL_XCODE_BUILD=$(xcodebuild -version | sed -n '2s/^Build version //p')
          ACTUAL_SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          test "$ACTUAL_XCODE_VERSION" = "$XCODE_VERSION"
          test "$ACTUAL_XCODE_BUILD" = "$XCODE_BUILD"
          test "$ACTUAL_SDK" = "$IPHONEOS_SDK_VERSION"
          xcodebuild -version
          echo "iPhoneOS SDK $ACTUAL_SDK"

      - name: Install pinned XcodeGen release
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/xcodegen-${XCODEGEN_VERSION}.zip"
          ROOT="$RUNNER_TEMP/xcodegen-${XCODEGEN_VERSION}"
          rm -rf "$ROOT" "$ARCHIVE"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 3 \
            --output "$ARCHIVE" "$XCODEGEN_URL"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$ROOT"
          unzip -q "$ARCHIVE" -d "$ROOT"
          XCODEGEN_BIN="$ROOT/xcodegen/bin/xcodegen"
          test -x "$XCODEGEN_BIN"
          ACTUAL_XCODEGEN_VERSION=$("$XCODEGEN_BIN" --version | awk '{print $NF}')
          test "$ACTUAL_XCODEGEN_VERSION" = "$XCODEGEN_VERSION"
          echo "$ROOT/xcodegen/bin" >> "$GITHUB_PATH"
          "$XCODEGEN_BIN" --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          test -f RemoteAIMobile.xcodeproj/project.pbxproj
          xcodebuild -project RemoteAIMobile.xcodeproj -list

      - name: Record build provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "event=$GITHUB_EVENT_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo "xcode_version=$XCODE_VERSION"
            echo "xcode_build=$XCODE_BUILD"
            echo "iphoneos_sdk=$IPHONEOS_SDK_VERSION"
            echo "xcodegen_version=$XCODEGEN_VERSION"
            echo "xcodegen_release_sha256=$XCODEGEN_SHA256"
            echo "checkout_action_sha=3d3c42e5aac5ba805825da76410c181273ba90b1"
            echo "upload_artifact_action_sha=043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
          } | tee build/build-provenance.txt

      - name: Create pinned iPhone 13 Pro simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes -j | python3 -c 'import json,sys; target=sys.argv[1]; runtimes=json.load(sys.stdin)["runtimes"]; ok=any(x.get("identifier")==target and x.get("isAvailable") for x in runtimes); raise SystemExit(0 if ok else 1)' "$IOS_SIM_RUNTIME"
          UDID=$(xcrun simctl create RemoteAI-iPhone13Pro com.apple.CoreSimulator.SimDeviceType.iPhone-13-Pro "$IOS_SIM_RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Protocol Security / Fuzz
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          set -o pipefail
          xcodebuild test \
            -project RemoteAIMobile.xcodeproj \
            -scheme RemoteAIMobile \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:RemoteAIMobileTests/ProtocolSecurityTests \
            | tee build/protocol-security.log
          grep -E 'PROTOCOL_FUZZ_(NEGATIVE|CRYPTO|SIZE|RECOVERY|TOTAL)' build/protocol-security.log
          grep -E 'Executed [0-9]+ tests?, with 0 failures' build/protocol-security.log | tail -1

      - name: Live iOS Relay pairing challenge smoke
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REMOTEAI_LIVE_RELAY_URL: "https://remoteai-relay.qaz60499.workers.dev"
          REMOTEAI_LIVE_MACHINE_ID: "machine-60e5101d-d386-464b-ac41-3e546ca800a0"
        run: |
          set -euo pipefail
          mkdir -p build
          set -o pipefail
          xcodebuild test \
            -project RemoteAIMobile.xcodeproj \
            -scheme RemoteAIMobile \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:RemoteAIMobileTests/PairingTests/testLiveRelayChallengeFromIOSURLSession \
            | tee build/live-pairing.log
          grep -E 'Executed [0-9]+ tests?, with 0 failures' build/live-pairing.log | tail -1

      - name: Unit and UI tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          set -o pipefail
          xcodebuild test \
            -project RemoteAIMobile.xcodeproj \
            -scheme RemoteAIMobile \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -skip-testing:RemoteAIMobileTests/ProtocolSecurityTests \
            | tee build/tests.log
          grep -E 'Executed [0-9]+ tests?, with 0 failures' build/tests.log | tail -1

      - name: Build unsigned iphoneos arm64 app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project RemoteAIMobile.xcodeproj \
            -scheme RemoteAIMobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            VALID_ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify device app and ad-hoc sign
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -1)
          test -n "$APP" && test -d "$APP"
          PLIST="$APP/Info.plist"
          test -f "$PLIST"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PLIST")
          PLATFORM=$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$PLIST")
          test "$BUNDLE" = 'com.remoteai.mobile'
          test "$MIN_OS" = '15.0'
          test "$PLATFORM" = 'iphoneos'
          test -x "$APP/$EXEC"
          file "$APP/$EXEC"
          test "$(lipo -archs "$APP/$EXEC")" = 'arm64'
          otool -l "$APP/$EXEC" | awk '/LC_BUILD_VERSION/{f=1;n=0} f{print;n++} n>8{f=0}' | grep -q 'platform 2'
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --strict "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q '^Signature=adhoc$'
          echo "bundle=$BUNDLE"
          echo "version=$VERSION"
          echo "minimum_ios=$MIN_OS"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package and audit TrollStore IPA
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          IPA_NAME="RemoteAI-${{ steps.package.outputs.version }}-${SHORT_SHA}.ipa"
          rm -rf build/package
          mkdir -p build/package/Payload
          ditto "${{ steps.package.outputs.app }}" "build/package/Payload/RemoteAI.app"
          find build/package -exec touch -h -t 202001010000 {} +
          (cd build/package && /usr/bin/zip -X -qry "../$IPA_NAME" Payload)
          test -s "build/$IPA_NAME"
          chmod +x scripts/verify_ipa.sh
          scripts/verify_ipa.sh "build/$IPA_NAME" com.remoteai.mobile | tee build/ipa-verification.txt
          shasum -a 256 "build/$IPA_NAME" | tee "build/$IPA_NAME.sha256"
          echo "name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Reproducible packaging check
        shell: bash
        run: |
          set -euo pipefail
          IPA_NAME="${{ steps.ipa.outputs.name }}"
          REPRO="build/repro-$IPA_NAME"
          rm -f "$REPRO"
          (cd build/package && /usr/bin/zip -X -qry "../repro-$IPA_NAME" Payload)
          cmp "build/$IPA_NAME" "$REPRO"
          test "$(shasum -a 256 "build/$IPA_NAME" | awk '{print $1}')" = "$(shasum -a 256 "$REPRO" | awk '{print $1}')"
          rm -f "$REPRO"
          echo "Deterministic IPA packaging PASS"

      - name: IPA verifier negative tests
        shell: bash
        run: |
          set -euo pipefail
          IPA="build/${{ steps.ipa.outputs.name }}"
          CORRUPT="build/corrupted-negative.ipa"
          TRAVERSAL="build/path-traversal-negative.ipa"
          DUPLICATE="build/duplicate-entry-negative.ipa"
          SYMLINK="build/symlink-negative.ipa"

          SIZE=$(stat -f%z "$IPA")
          dd if="$IPA" of="$CORRUPT" bs=1 count=$((SIZE / 2)) status=none

          python3 - "$TRAVERSAL" "$DUPLICATE" "$SYMLINK" <<'PY'
          import stat
          import sys
          import warnings
          import zipfile

          traversal, duplicate, symlink = sys.argv[1:]
          with zipfile.ZipFile(traversal, "w") as zf:
              zf.writestr("Payload/../escape.txt", "blocked")
          with warnings.catch_warnings():
              warnings.simplefilter("ignore", UserWarning)
              with zipfile.ZipFile(duplicate, "w") as zf:
                  zf.writestr("Payload/RemoteAI.app/Info.plist", b"first")
                  zf.writestr("Payload/RemoteAI.app/Info.plist", b"second")
          with zipfile.ZipFile(symlink, "w") as zf:
              info = zipfile.ZipInfo("Payload/RemoteAI.app/link")
              info.create_system = 3
              info.external_attr = (stat.S_IFLNK | 0o777) << 16
              zf.writestr(info, "../../outside")
          PY

          for candidate in "$CORRUPT" "$TRAVERSAL" "$DUPLICATE" "$SYMLINK"; do
            if scripts/verify_ipa.sh "$candidate" com.remoteai.mobile >/dev/null 2>&1; then
              echo "Negative IPA unexpectedly passed verification: $candidate" >&2
              exit 1
            fi
          done
          rm -f "$CORRUPT" "$TRAVERSAL" "$DUPLICATE" "$SYMLINK"
          echo "Corrupt/traversal/duplicate/symlink IPA cases rejected as expected"

      - name: Unzip structure test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/unzip-check
          mkdir -p build/unzip-check
          unzip -q "build/${{ steps.ipa.outputs.name }}" -d build/unzip-check
          test -d build/unzip-check/Payload/RemoteAI.app
          test -f build/unzip-check/Payload/RemoteAI.app/Info.plist
          test -x build/unzip-check/Payload/RemoteAI.app/RemoteAI

      - name: Upload IPA artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, GitHub-verified release commit
        with:
          name: RemoteAI-TrollStore-IPA
          path: |
            build/${{ steps.ipa.outputs.name }}
            build/${{ steps.ipa.outputs.name }}.sha256
            build/ipa-verification.txt
            build/build-provenance.txt
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo '## RemoteAI Mobile build'
            echo '- Workflow: GREEN if this step runs'
            echo '- Bundle ID: `com.remoteai.mobile`'
            echo '- Minimum iOS: `15.0`'
            echo '- Device architecture: `arm64`'
            echo '- Xcode: `${{ env.XCODE_VERSION }}` (`${{ env.XCODE_BUILD }}`)'
            echo '- iPhoneOS SDK: `${{ env.IPHONEOS_SDK_VERSION }}`'
            echo '- XcodeGen: `${{ env.XCODEGEN_VERSION }}` / SHA256 `${{ env.XCODEGEN_SHA256 }}`'
            echo '- IPA: `${{ steps.ipa.outputs.name }}`'
            echo '- Packaging: ad-hoc signed, TrollStore-targeted, no Apple Developer certificate/provisioning profile'
            echo '- Artifact ID: `${{ steps.upload.outputs.artifact-id }}`'
            echo '- Artifact digest: `${{ steps.upload.outputs.artifact-digest }}`'
            echo '- Protocol Security / Fuzz:'
            grep -E 'PROTOCOL_FUZZ_(NEGATIVE|CRYPTO|SIZE|RECOVERY|TOTAL)' build/protocol-security.log | sed 's/^/- `/' | sed 's/$/`/'
            echo '- IPA SHA256:'
            echo '```'
            cat "build/${{ steps.ipa.outputs.name }}.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
