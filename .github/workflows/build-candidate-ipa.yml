name: Build Candidate IPA

on:
  workflow_dispatch:
    inputs:
      gate:
        description: Validation scope
        type: choice
        options: [candidate, streaming, sync, web-controls, copy-controls, runtime-issues, runtime-issues-device, web-tab-race, provider-observation]
        default: candidate
      unit_sanitizer:
        description: Optional unit-test memory diagnostic on the disposable simulator
        type: choice
        options: [none, address, thread]
        default: none

permissions:
  contents: read
  actions: read

concurrency:
  group: remoteai-ios-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "16.4"
  XCODE_BUILD: "16F6"
  IPHONEOS_SDK_VERSION: "18.5"
  IOS_SIM_RUNTIME: "com.apple.CoreSimulator.SimRuntime.iOS-18-5"
  DEVELOPER_DIR: "/Applications/Xcode_16.4.app/Contents/Developer"
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
  XCODEGEN_URL: "https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip"

jobs:
  build:
    name: Candidate Test + Device IPA
    if: github.event_name == 'workflow_dispatch' && inputs.gate != 'web-tab-race'
    runs-on: macos-15
    # Full candidate run 40326759373 passed all 14 isolated UI cases, then
    # exhausted 60 minutes during cadence sampling before device packaging.
    # Allow the measured 45-minute UI phase plus compiler/simulator startup,
    # cadence, signing and evidence export. Per-test deadlines stay unchanged.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify inherited status-sync CI evidence
        if: inputs.gate == 'runtime-issues-device'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_SHA=78bca954398fd6cbf9412e4ac8edddebb7db32f4
          RUN_ID=40740529775
          RUN_ATTEMPT=1
          git cat-file -e "${BASELINE_SHA}^{commit}"
          git diff --quiet "$BASELINE_SHA" "$GITHUB_SHA" -- \
            RemoteAIMobile RemoteAIMobileTests RemoteAIMobileUITests
          python3 - "$BASELINE_SHA" "$GITHUB_SHA" <<'PY'
          import re
          import subprocess
          import sys

          baseline_sha, candidate_sha = sys.argv[1:]
          setting = re.compile(r"(?m)^(\s*CURRENT_PROJECT_VERSION:\s*)(\d+)(\s*)$")

          def read_project(revision):
              result = subprocess.run(
                  ["git", "show", f"{revision}:project.yml"],
                  check=True, capture_output=True, text=True)
              text = result.stdout
              matches = list(setting.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one CURRENT_PROJECT_VERSION in {revision}.")
              return text, matches[0].group(2)

          baseline_project, baseline_build = read_project(baseline_sha)
          candidate_project, candidate_build = read_project(candidate_sha)
          if baseline_build != "51" or candidate_build != "52":
              raise SystemExit("The inherited source must be Build 51 and the candidate must be Build 52.")
          normalize = lambda text: setting.sub(r"\g<1><BUILD_NUMBER>\g<3>", text)
          if normalize(baseline_project) != normalize(candidate_project):
              raise SystemExit("project.yml contains changes beyond CURRENT_PROJECT_VERSION 51 -> 52.")
          print(f"Verified Swift source tree at {baseline_sha}; project.yml only changes build {baseline_build} -> {candidate_build}.")
          PY
          python3 - "$BASELINE_SHA" "$RUN_ID" "$RUN_ATTEMPT" <<'PY'
          import json
          import os
          import sys
          import urllib.request

          baseline_sha, run_id, attempt = sys.argv[1:]
          repository = os.environ["GITHUB_REPOSITORY"]
          api_url = os.environ["GITHUB_API_URL"].rstrip("/")
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(path):
              request = urllib.request.Request(f"{api_url}/repos/{repository}/{path}", headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          run = get_json(f"actions/runs/{run_id}")
          if (run.get("head_sha") != baseline_sha or
                  run.get("head_branch") != "fix/status-sync-ci-20261028" or
                  run.get("event") != "push" or run.get("status") != "completed" or
                  run.get("conclusion") != "success" or run.get("run_attempt") != int(attempt)):
              raise SystemExit("Inherited status-sync run metadata did not match the pinned successful source run.")

          jobs = get_json(f"actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100").get("jobs", [])
          status_jobs = [job for job in jobs if job.get("name") == "status-sync"]
          if len(status_jobs) != 1:
              raise SystemExit("The inherited status-sync job was not found exactly once.")
          job = status_jobs[0]
          if job.get("head_sha") != baseline_sha or job.get("conclusion") != "success":
              raise SystemExit("The inherited status-sync job did not succeed on the pinned source.")
          steps = {step.get("name"): step.get("conclusion") for step in job.get("steps", [])}
          if steps.get("New status tests and adjacent ordering regressions") != "success":
              raise SystemExit("The inherited focused test step was not confirmed successful.")
          if steps.get("Compile arm64 app without signing or packaging") != "success":
              raise SystemExit("The inherited unsigned device compile step was not confirmed successful.")

          artifacts = get_json(f"actions/runs/{run_id}/artifacts?per_page=100").get("artifacts", [])
          evidence = [artifact for artifact in artifacts
                      if artifact.get("name") == "status-sync-evidence" and not artifact.get("expired")]
          if len(evidence) != 1:
              raise SystemExit("The inherited status-sync evidence artifact is missing or expired.")
          print(f"Verified completed successful run {run_id} attempt {attempt} at {baseline_sha}: "
                "focused tests and unsigned arm64 compile steps succeeded; evidence artifact is available.")
          PY
          EVIDENCE_DIR="$RUNNER_TEMP/inherited-status-sync-evidence"
          mkdir -p "$EVIDENCE_DIR"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name status-sync-evidence --dir "$EVIDENCE_DIR"
          python3 - "$EVIDENCE_DIR" <<'PY'
          import json
          import pathlib
          import sys

          evidence = pathlib.Path(sys.argv[1])
          summary = json.loads((evidence / "test-summary.json").read_text())
          if (summary.get("result") != "Passed" or summary.get("totalTestCount") != 14 or
                  summary.get("passedTests") != 14 or summary.get("failedTests") != 0 or
                  summary.get("skippedTests") != 0):
              raise SystemExit("The inherited test summary did not confirm 14 passed, 0 failed, 0 skipped.")
          compile_log = (evidence / "device-compile.log").read_text(errors="replace")
          if "CODE_SIGNING_ALLOWED=NO" not in compile_log or "** BUILD SUCCEEDED **" not in compile_log:
              raise SystemExit("The inherited device compile log did not confirm an unsigned successful build.")
          print("Inherited evidence confirms 14/14 XCTest and unsigned generic iOS arm64 build; this gate does not rerun them.")
          PY

      - name: Security and protocol audit
        shell: bash
        run: bash scripts/security_audit.sh

      - name: Select pinned stable Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          [[ "$XCODE_APP" != *[Bb]eta* ]]
          test "$DEVELOPER_DIR" = "$XCODE_APP/Contents/Developer"
          test -d "$DEVELOPER_DIR"
          ACTUAL_XCODE_VERSION=$(xcodebuild -version | sed -n '1s/^Xcode //p')
          ACTUAL_XCODE_BUILD=$(xcodebuild -version | sed -n '2s/^Build version //p')
          ACTUAL_SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          test "$ACTUAL_XCODE_VERSION" = "$XCODE_VERSION"
          test "$ACTUAL_XCODE_BUILD" = "$XCODE_BUILD"
          test "$ACTUAL_SDK" = "$IPHONEOS_SDK_VERSION"

      - name: Install pinned XcodeGen release
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/xcodegen-${XCODEGEN_VERSION}.zip"
          ROOT="$RUNNER_TEMP/xcodegen-${XCODEGEN_VERSION}"
          rm -rf "$ROOT" "$ARCHIVE"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 3 --output "$ARCHIVE" "$XCODEGEN_URL"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$ROOT"
          unzip -q "$ARCHIVE" -d "$ROOT"
          XCODEGEN_BIN="$ROOT/xcodegen/bin/xcodegen"
          test -x "$XCODEGEN_BIN"
          test "$("$XCODEGEN_BIN" --version | awk '{print $NF}')" = "$XCODEGEN_VERSION"
          echo "$ROOT/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          test -f RemoteAIMobile.xcodeproj/project.pbxproj

      - name: Record candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          {
            echo "candidate_build=true"
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "event=$GITHUB_EVENT_NAME"
            echo "validation_scope=${{ inputs.gate }}"
            if [[ '${{ inputs.gate }}' == 'runtime-issues-device' ]]; then
              echo "device_validation_scope=iphoneos arm64 compile and candidate IPA package only"
              echo "immutable_source_tree_sha=78bca954398fd6cbf9412e4ac8edddebb7db32f4"
              echo "project_yml_build_number_change=51_to_52_only; normalized project.yml equals immutable source baseline"
              echo "inherited_native_unit_evidence=run40740529775/attempt1 New status tests and adjacent ordering regressions (14 XCTest; source tree, API step result, and evidence artifact verified by preflight; not rerun in this gate)"
              echo "wireless_device_smoke=pending; not_run_by_this_device_only_gate"
              echo "ui_validation=not_run_by_this_gate; no_UI_PASS_claim"
              echo "protocol_security_fuzz=not_run_in_runtime_issues_device_gate"
              echo "full_unit_suite=not_run_in_runtime_issues_device_gate"
              echo "streaming_cadence_and_process_stress=not_run_in_runtime_issues_device_gate"
              echo "security_audit=scripts/security_audit.sh rerun on this commit"
            elif [[ '${{ inputs.gate }}' == 'runtime-issues' || '${{ inputs.gate }}' == 'provider-observation' ]]; then
              echo "inherited_full_unit_security_baseline=a33e49f/run40468844319; inherited_streaming_baseline=a33e49f/run40504021022-attempt2 (historical evidence; not revalidated by this run)"
              echo "security_audit=scripts/security_audit.sh rerun on this commit"
              echo "protocol_security_fuzz=not_run_in_runtime_issues_gate"
              echo "full_unit_suite=not_run_in_runtime_issues_gate"
              echo "streaming_cadence_and_process_stress=not_run_in_runtime_issues_gate"
              echo "runtime_issue_unit_scope=RuntimeIssueSummaryTests (6 methods); GenerationTerminalOutcomeTests (2 methods); SessionCatalogTests (4 methods); provider surface state/observation tests (2 methods); InterruptedSessionStatusTests (3 methods); ProviderObservationOrderingTests (1 method); targeted PairingTests and RemoteAIMobileTests regressions"
              echo "runtime_issue_ui_scope=testRuntimeIssueSummaryOpensAndRefreshesCapabilities;testOpenCachedWebConversation"
              echo "workspace_store_lifecycle_scope=testWorkspaceCoalescesDuplicateInitializationAndLifecycleRace"
              if [[ '${{ inputs.gate }}' == 'provider-observation' ]]; then
                echo "previous_source_reproduction=not_rerun; inherited_verified_failure_from_run40821539793; new_observation_getters_absent_in_old_source"
              fi
            elif [[ '${{ inputs.gate }}' == 'web-controls' ]]; then
              echo "unchanged_full_candidate_baseline=7fd609bde530269347b9089cbce0f2894ed9c232/run39204233990"
              echo "full_unit_and_stream_stress=not_rerun_views_only_controls_change"
            elif [[ '${{ inputs.gate }}' == 'copy-controls' ]]; then
              echo "unchanged_full_candidate_baseline=7fd609bde530269347b9089cbce0f2894ed9c232/run39204233990"
              echo "copy_controls_validation=full_unit_security_navigation_device_build"
              echo "long_stream_stress=not_rerun_copy_parser_and_feedback_change"
            fi
            echo "xcode_version=$XCODE_VERSION"
            echo "xcode_build=$XCODE_BUILD"
            echo "iphoneos_sdk=$IPHONEOS_SDK_VERSION"
            echo "xcodegen_version=$XCODEGEN_VERSION"
            echo "external_live_relay_pairing_smoke=not_run_in_candidate_workflow"
          } | tee build/build-provenance.txt

      - name: Create pinned iPhone 13 Pro simulator
        id: simulator
        if: inputs.gate != 'runtime-issues-device'
        shell: bash
        run: |
          set -euo pipefail
          simctl_bounded() {
            python3 - "$@" <<'PY'
          import subprocess, sys
          command = ["xcrun", "simctl", *sys.argv[1:]]
          try:
              result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=45)
          except subprocess.TimeoutExpired:
              print("CoreSimulator command timed out after 45 seconds: " + " ".join(command), file=sys.stderr)
              raise SystemExit(124)
          if result.stderr:
              print(result.stderr.rstrip(), file=sys.stderr)
          if result.returncode != 0:
              raise SystemExit(result.returncode)
          print(result.stdout, end="")
          PY
          }
          recycle_core_simulator() {
            killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
            sleep "$1"
          }
          create_simulator() {
            simctl_bounded create "$1" com.apple.CoreSimulator.SimDeviceType.iPhone-13-Pro "$IOS_SIM_RUNTIME"
          }

          # Reuse the release workflow's bounded simulator create path: the
          # read-only `simctl list runtimes` probe can hang before creation.
          recycle_core_simulator 8
          if ! UDID=$(create_simulator RemoteAI-Candidate-iPhone13Pro); then
            echo "Initial CoreSimulator create failed or timed out; recycling CoreSimulatorService and retrying once."
            recycle_core_simulator 12
            UDID=$(create_simulator RemoteAI-Candidate-iPhone13Pro)
          fi
          [[ "$UDID" =~ ^[0-9A-Fa-f-]{36}$ ]]
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Created pinned simulator: $UDID"

      - name: Protocol Security / Fuzz
        if: inputs.gate != 'streaming' && inputs.gate != 'runtime-issues' && inputs.gate != 'provider-observation' && inputs.gate != 'runtime-issues-device'
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild test \
            -project RemoteAIMobile.xcodeproj \
            -scheme RemoteAIMobile \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:RemoteAIMobileTests/ProtocolSecurityTests \
            | tee build/protocol-security.log
          grep -E 'PROTOCOL_FUZZ_(NEGATIVE|CRYPTO|SIZE|RECOVERY|TOTAL)' build/protocol-security.log
          grep -E 'Executed [0-9]+ tests?, with 0 failures' build/protocol-security.log | tail -1

      - name: Record pinned compiler nested actor isolation
        if: inputs.unit_sanitizer != 'none' && inputs.unit_sanitizer != '' && inputs.gate != 'runtime-issues-device'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, tempfile
          source = '''
          @MainActor final class Outer {
              final class Inner { var rows: Int = 0 }
          }
          func readWithoutAwait(_ inner: Outer.Inner) async -> Int { inner.rows }
          '''
          with tempfile.TemporaryDirectory() as folder:
              path = pathlib.Path(folder) / 'NestedActorIsolation.swift'
              path.write_text(source)
              result = subprocess.run(['xcrun', 'swiftc', '-swift-version', '5',
                                       '-strict-concurrency=complete', '-warnings-as-errors',
                                       '-typecheck', str(path)], capture_output=True, text=True, timeout=30)
          version = subprocess.run(['xcrun', 'swiftc', '--version'], capture_output=True,
                                   text=True, check=True, timeout=30).stdout
          evidence = {'compiler': version, 'swiftLanguageVersion': '5', 'source': source,
                      'exitCode': result.returncode, 'stdout': result.stdout, 'stderr': result.stderr,
                      'scope': 'compiler inference probe only; not a runtime race or heap-corruption proof'}
          pathlib.Path('build/unit-actor-isolation-probe.json').write_text(json.dumps(evidence, indent=2))
          print(json.dumps(evidence))
          PY

      - name: Unit tests
        if: inputs.gate != 'streaming' && inputs.gate != 'web-controls' && inputs.gate != 'runtime-issues' && inputs.gate != 'provider-observation' && inputs.gate != 'runtime-issues-device'
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          set --
          if [[ '${{ inputs.unit_sanitizer }}' == 'address' ]]; then
            set -- -enableAddressSanitizer YES
          elif [[ '${{ inputs.unit_sanitizer }}' == 'thread' ]]; then
            set -- -enableThreadSanitizer YES
          fi
          xcodebuild test \
            -project RemoteAIMobile.xcodeproj \
            -scheme RemoteAIMobile \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath build/unit-tests.xcresult \
            "$@" \
            -skip-testing:RemoteAIMobileTests/ProtocolSecurityTests \
            -skip-testing:RemoteAIMobileUITests \
            | tee build/tests.log
          grep -E 'PROJECT_ORDER_STRESS_TOTAL=25000' build/tests.log
          grep -E 'PROJECT_REFRESH_STRESS_TOTAL=2500' build/tests.log
          grep -E 'Executed [0-9]+ tests?, with 0 failures' build/tests.log | tail -1

      - name: Reproduce terminal and catalog regressions on the previous WorkspaceStore source
        if: inputs.gate == 'runtime-issues'
        shell: bash
        run: |
          set -euo pipefail
          PATCHED_SOURCE="$RUNNER_TEMP/WorkspaceStore.terminal-fixed.swift"
          cp RemoteAIMobile/WorkspaceStore.swift "$PATCHED_SOURCE"
          trap 'cp "$PATCHED_SOURCE" RemoteAIMobile/WorkspaceStore.swift' EXIT
          # Keep candidate SQLiteStore and the new tests; revert only WorkspaceStore for the baseline.
          git show d80e96069416671c36528e42d1857a3274b0c2af:RemoteAIMobile/WorkspaceStore.swift > RemoteAIMobile/WorkspaceStore.swift
          set +e
          xcodebuild test \
            -project RemoteAIMobile.xcodeproj \
            -scheme RemoteAIMobile \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:RemoteAIMobileTests/GenerationTerminalOutcomeTests \
            -only-testing:RemoteAIMobileTests/SessionCatalogTests/testLiveRegistrationAdvancesCursorWith648RowCatalogOverKVLimit \
            -resultBundlePath build/terminal-before.xcresult \
            > build/terminal-before.log 2>&1
          BASELINE_EXIT=$?
          set -e
          test "$BASELINE_EXIT" -ne 0
          grep -E 'XCTAssert.*failed' build/terminal-before.log
          grep -F "Test Case '-[RemoteAIMobileTests.GenerationTerminalOutcomeTests testAntigravityCanceledTerminalKeepsPartialAndDoesNotDuplicateIt]' failed" build/terminal-before.log
          grep -F "Test Case '-[RemoteAIMobileTests.GenerationTerminalOutcomeTests testAntigravityInterruptedUnknownAndConfirmedFailureHaveDistinctTerminalStates]' failed" build/terminal-before.log
          grep -F "Test Case '-[RemoteAIMobileTests.SessionCatalogTests testLiveRegistrationAdvancesCursorWith648RowCatalogOverKVLimit]' failed" build/terminal-before.log
          echo "TERMINAL_BEFORE_EXPECTED_FAILURE=$BASELINE_EXIT"

      - name: Reproduce recent sorting on installed Build54 source
        if: inputs.gate == 'provider-observation'
        shell: bash
        run: |
          set -euo pipefail
          PATCHED_SOURCE="$RUNNER_TEMP/WorkspaceStore.recent-sorted.swift"
          cp RemoteAIMobile/WorkspaceStore.swift "$PATCHED_SOURCE"
          trap 'cp "$PATCHED_SOURCE" RemoteAIMobile/WorkspaceStore.swift' EXIT
          git show de0d8f0baeaa3beb8dd38f0fe8071d690ee3bf38:RemoteAIMobile/WorkspaceStore.swift > RemoteAIMobile/WorkspaceStore.swift
          set +e
          xcodebuild test -project RemoteAIMobile.xcodeproj -scheme RemoteAIMobile \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath build/recent-sort-baseline.xcresult \
            -only-testing:RemoteAIMobileTests/RemoteAIMobileTests/testProjectRecentDisplaySortsTimestampsWithoutMutatingProviderPages \
            > build/recent-sort-baseline.log 2>&1
          RESULT=$?
          set -e
          if [[ "$RESULT" -eq 0 ]]; then
            echo 'The new regression did not reproduce on the installed Build54 source.'
            exit 1
          fi
          grep -E "Test Case .*testProjectRecentDisplaySortsTimestampsWithoutMutatingProviderPages.*failed" build/recent-sort-baseline.log
          grep -F 'The display must sort by updatedAt' build/recent-sort-baseline.log

      - name: Runtime issue focused unit tests
        if: inputs.gate == 'runtime-issues' || inputs.gate == 'provider-observation'
        id: runtimeIssueTests
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          set --
          if [[ '${{ inputs.unit_sanitizer }}' == 'address' ]]; then
            set -- -enableAddressSanitizer YES
          elif [[ '${{ inputs.unit_sanitizer }}' == 'thread' ]]; then
            set -- -enableThreadSanitizer YES
          fi
          xcodebuild test \
            -project RemoteAIMobile.xcodeproj \
            -scheme RemoteAIMobile \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath build/runtime-issues-tests.xcresult \
            "$@" \
            -only-testing:RemoteAIMobileTests/RuntimeIssueSummaryTests \
            -only-testing:RemoteAIMobileTests/GenerationTerminalOutcomeTests \
            -only-testing:RemoteAIMobileTests/SessionCatalogTests \
            -only-testing:RemoteAIMobileTests/RemoteAIMobileTests/testProjectRecentDisplaySortsTimestampsWithoutMutatingProviderPages \
            -only-testing:RemoteAIMobileTests/PairingTests/testForegroundCallbacksAvoidUnnecessaryReconnectAndHideBriefStatusFlash \
            -only-testing:RemoteAIMobileTests/RemoteAIMobileTests/testBackgroundTaskStatusStaysSeparateFromIdleAndStaleConversationStatus \
            -only-testing:RemoteAIMobileTests/RemoteAIMobileTests/testWorkspaceCoalescesDuplicateInitializationAndLifecycleRace \
            -only-testing:RemoteAIMobileTests/RemoteAIMobileTests/testRetryWithMissingOrCorruptOriginalCommandStaysUnknownAndDoesNotDropModelOrAttachments \
            -only-testing:RemoteAIMobileTests/RemoteAIMobileTests/testOversizedPendingCommandFailsBeforeProviderSend \
            -only-testing:RemoteAIMobileTests/RemoteAIMobileTests/testTransportDisconnectAutoReconnectsAndReplaysExactCommandWithoutDuplicateSideEffect \
            -only-testing:RemoteAIMobileTests/RemoteAIMobileTests/testAlreadyExecutedIsRecoveredAsSameCommandInsteadOfRollingBackComposer \
            -only-testing:RemoteAIMobileTests/RemoteAIMobileTests/testWorkspaceStoreStopReturnsSuccessAndConvergesSessionIdle \
            -only-testing:RemoteAIMobileTests/RemoteAIMobileTests/testConcurrentStopRequestsShareOneIdempotentRemoteCommand \
            -only-testing:RemoteAIMobileTests/RemoteAIMobileTests/testWebProviderSurfaceIssueShowsOnPhoneWithoutFabricatingBusyStateAndClearsOnRecovery \
            -only-testing:RemoteAIMobileTests/CodexDirectoryTests/testWebProviderStatusSnapshotDecodesOriginalMessageAndObservationTimes \
            -only-testing:RemoteAIMobileTests/CloudflareTransportPoisonReplayTests \
            -only-testing:RemoteAIMobileTests/WebTabTests \
            -only-testing:RemoteAIMobileTests/StopIdentityTests \
            -only-testing:RemoteAIMobileTests/InterruptedSessionStatusTests \
            -only-testing:RemoteAIMobileTests/ProviderObservationOrderingTests \
            | tee build/runtime-issues-tests.log
          xcrun xcresulttool get test-results summary \
            --path build/runtime-issues-tests.xcresult --format json \
            > build/runtime-issues-tests-summary.json
          xcrun xcresulttool get test-results tests \
            --path build/runtime-issues-tests.xcresult --format json \
            > build/runtime-issues-test-nodes.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          summary = json.loads(Path('build/runtime-issues-tests-summary.json').read_text())
          test_nodes = json.loads(Path('build/runtime-issues-test-nodes.json').read_text())
          required = {
              'testProjectRecentDisplaySortsTimestampsWithoutMutatingProviderPages',
              'testRetryWithMissingOrCorruptOriginalCommandStaysUnknownAndDoesNotDropModelOrAttachments',
              'testOversizedPendingCommandFailsBeforeProviderSend',
              'testTransportDisconnectAutoReconnectsAndReplaysExactCommandWithoutDuplicateSideEffect',
              'testAlreadyExecutedIsRecoveredAsSameCommandInsteadOfRollingBackComposer',
              'testWorkspaceStoreStopReturnsSuccessAndConvergesSessionIdle',
              'testConcurrentStopRequestsShareOneIdempotentRemoteCommand',
              'testWebProviderSurfaceIssueShowsOnPhoneWithoutFabricatingBusyStateAndClearsOnRecovery',
              'testWebProviderStatusSnapshotDecodesOriginalMessageAndObservationTimes',
          }
          for source in (
              'RemoteAIMobileTests/CloudflareTransportPoisonReplayTests.swift',
              'RemoteAIMobileTests/WebTabTests.swift',
              'RemoteAIMobileTests/StopIdentityTests.swift',
              'RemoteAIMobileTests/InterruptedSessionStatusTests.swift',
              'RemoteAIMobileTests/ProviderObservationOrderingTests.swift',
          ):
              text = Path(source).read_text()
              cases = re.findall(r'^\s*func\s+(test[A-Za-z0-9_]+)\s*\(', text, re.MULTILINE)
              if not cases:
                  raise SystemExit(f'No XCTest cases found in {source}')
              required.update(cases)

          result_tree = json.dumps(test_nodes, ensure_ascii=False)
          missing = sorted(name for name in required if name not in result_tree)
          if missing:
              raise SystemExit('XCTest result bundle omitted requested cases: ' + ', '.join(missing))

          total = summary.get('totalTestCount')
          passed = summary.get('passedTests')
          failed = summary.get('failedTests')
          skipped = summary.get('skippedTests')
          if (summary.get('result') != 'Passed' or failed != 0 or skipped != 0 or
                  total != passed or total < 15 + len(required)):
              raise SystemExit(f'Unexpected XCTest summary: {summary}')

          print(f'RUNTIME_ISSUES_XCTEST_PASS={total}; required targeted cases present={len(required)}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'total_tests={total}\n')

      - name: Streaming unit tests
        if: inputs.gate == 'streaming'
        run: |
          set -euo pipefail
          xcodebuild test -project RemoteAIMobile.xcodeproj -scheme RemoteAIMobile -configuration Debug -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' -only-testing:RemoteAIMobileTests/AssistantStreamTests | tee build/stream-unit.log

      - name: UI tests with isolated simulator process lifecycle
        if: inputs.gate != 'runtime-issues-device'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_candidate_runner.py
          if [[ '${{ inputs.gate }}' == 'streaming' ]]; then
            python3 scripts/run_candidate_ui_tests.py \
              --udid '${{ steps.simulator.outputs.udid }}' \
              --only testLongStreamingTailStaysLiveWhileComposerAndHistoryRemainUsable \
              --only testLongStreaming50kTailStaysLiveWhileComposerAndHistoryRemainUsable \
              | tee build/ui-tests.log
          elif [[ '${{ inputs.gate }}' == 'runtime-issues' || '${{ inputs.gate }}' == 'provider-observation' ]]; then
            # Exercise the runtime issue summary plus cached conversation navigation.
            python3 scripts/run_candidate_ui_tests.py \
              --udid '${{ steps.simulator.outputs.udid }}' \
              --only testRuntimeIssueSummaryOpensAndRefreshesCapabilities \
              --only testOpenCachedWebConversation \
              | tee build/ui-tests.log
          elif [[ '${{ inputs.gate }}' == 'web-controls' || '${{ inputs.gate }}' == 'copy-controls' ]]; then
            # Exercise hierarchy/cached-Chat navigation for both control scopes.
            # copy-controls also runs the full unit suite above for its parser.
            # Keep prior evidence for unchanged long-stream stress scenarios.
            python3 scripts/run_candidate_ui_tests.py \
              --udid '${{ steps.simulator.outputs.udid }}' \
              --only testMachineRuntimeHierarchyOnIPhone \
              --only testOpenCachedWebConversation \
              | tee build/ui-tests.log
          elif [[ '${{ inputs.gate }}' == 'sync' ]]; then
            # Targeted regression gate for metadata/Project/Chat sync candidates.
            # The full candidate gate (including both long-stream stress cases)
            # remains unchanged and is independently required for final acceptance.
            python3 scripts/run_candidate_ui_tests.py \
              --udid '${{ steps.simulator.outputs.udid }}' \
              --only testMachineRuntimeHierarchyOnIPhone \
              --only testOpenCachedWebConversation \
              --only testConversationOpensAtLatestAndOffersReturnToBottomAfterBrowsingHistory \
              --only testDraftSurvivesLeavingAndReopeningConversation \
              --only testFastBackDuringDraftLoadDoesNotOverwriteSavedDraft \
              --only testRejectedSendDraftSurvivesConversationReopen \
              --only testUnknownSendDraftIsNotFlushedEmptyWhenConversationReopens \
              | tee build/ui-tests.log
          else
            python3 scripts/run_candidate_ui_tests.py \
              --udid '${{ steps.simulator.outputs.udid }}' \
              | tee build/ui-tests.log
          fi
          grep -E 'CANDIDATE_UI_TESTS_PASS=[1-9][0-9]*' build/ui-tests.log

      - name: Streaming cadence and process samples without accessibility polling
        if: inputs.gate != 'streaming' && inputs.gate != 'web-controls' && inputs.gate != 'copy-controls' && inputs.gate != 'runtime-issues' && inputs.gate != 'provider-observation' && inputs.gate != 'runtime-issues-device'
        run: |
          set -euo pipefail
          python3 scripts/sample_streaming_performance.py --udid '${{ steps.simulator.outputs.udid }}' | tee build/stream-performance.log

      - name: Build unsigned iphoneos arm64 app
        if: inputs.gate != 'streaming'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project RemoteAIMobile.xcodeproj \
            -scheme RemoteAIMobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            VALID_ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify device app and ad-hoc sign
        if: inputs.gate != 'streaming'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -1)
          test -n "$APP" && test -d "$APP"
          PLIST="$APP/Info.plist"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PLIST")
          PLATFORM=$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$PLIST")
          test "$BUNDLE" = 'com.remoteai.mobile'
          test "$MIN_OS" = '15.0'
          test "$PLATFORM" = 'iphoneos'
          test -x "$APP/$EXEC"
          test "$(lipo -archs "$APP/$EXEC")" = 'arm64'
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --strict "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q '^Signature=adhoc$'
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package and audit Candidate IPA
        if: inputs.gate != 'streaming'
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          IPA_NAME="RemoteAI-${{ steps.package.outputs.version }}-${SHORT_SHA}-candidate.ipa"
          rm -rf build/package
          mkdir -p build/package/Payload
          ditto "${{ steps.package.outputs.app }}" "build/package/Payload/RemoteAI.app"
          find build/package -exec touch -h -t 202001010000 {} +
          (cd build/package && /usr/bin/zip -X -qry "../$IPA_NAME" Payload)
          test -s "build/$IPA_NAME"
          chmod +x scripts/verify_ipa.sh
          scripts/verify_ipa.sh "build/$IPA_NAME" com.remoteai.mobile | tee build/ipa-verification.txt
          shasum -a 256 "build/$IPA_NAME" | tee "build/$IPA_NAME.sha256"
          echo "name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Reproducible packaging check
        if: inputs.gate != 'streaming'
        shell: bash
        run: |
          set -euo pipefail
          IPA_NAME="${{ steps.ipa.outputs.name }}"
          REPRO="build/repro-$IPA_NAME"
          (cd build/package && /usr/bin/zip -X -qry "../repro-$IPA_NAME" Payload)
          cmp "build/$IPA_NAME" "$REPRO"
          rm -f "$REPRO"

      - name: Candidate IPA verifier negative tests
        if: inputs.gate != 'streaming'
        shell: bash
        run: |
          set -euo pipefail
          IPA="build/${{ steps.ipa.outputs.name }}"
          CORRUPT="build/corrupted-negative.ipa"
          RENAMED_ENC="build/renamed-release-negative.ipa.enc"
          SIZE=$(stat -f%z "$IPA")
          dd if="$IPA" of="$CORRUPT" bs=1 count=$((SIZE / 2)) status=none
          cp "$IPA" "$RENAMED_ENC"
          for candidate in "$CORRUPT" "$RENAMED_ENC"; do
            if scripts/verify_ipa.sh "$candidate" com.remoteai.mobile >/dev/null 2>&1; then
              echo "Negative IPA unexpectedly passed verification: $candidate" >&2
              exit 1
            fi
          done
          rm -f "$CORRUPT" "$RENAMED_ENC"

      - name: Upload Candidate IPA artifact
        if: inputs.gate != 'streaming'
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RemoteAI-Candidate-IPA
          path: |
            build/${{ steps.ipa.outputs.name }}
            build/${{ steps.ipa.outputs.name }}.sha256
            build/ipa-verification.txt
            build/build-provenance.txt
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

      - name: Summary
        if: inputs.gate != 'streaming'
        shell: bash
        run: |
          {
            echo '## RemoteAI Candidate IPA'
            echo '- Candidate only; not final release acceptance'
            echo '- External Live iOS Relay pairing smoke: intentionally excluded from this workflow'
            if [[ '${{ inputs.gate }}' == 'runtime-issues-device' ]]; then
              echo '- Static security audit (`scripts/security_audit.sh`): PASS on this commit'
              echo '- Device validation: PASS (current iphoneos arm64 build, signing, IPA verification, and reproducible package)'
              echo '- Inherited native unit evidence: PASS (14 XCTest; run40740529775 attempt 1 on SHA 78bca954398fd6cbf9412e4ac8edddebb7db32f4; verified from the prior run artifact, not rerun here)'
              echo '- Wireless device smoke: PENDING; not run or passed by this device-only gate'
              echo '- UI validation: NOT RUN by this device-only gate; no UI PASS claim'
              echo '- Protocol Security / Fuzz: NOT RUN in this gate'
              echo '- Full unit suite: NOT RUN in this gate'
              echo '- Streaming cadence/process stress: NOT RUN in this gate'
            elif [[ '${{ inputs.gate }}' == 'runtime-issues' || '${{ inputs.gate }}' == 'provider-observation' ]]; then
              echo '- Static security audit (`scripts/security_audit.sh`): PASS on this commit'
              echo '- Protocol Security / Fuzz: NOT RUN in this gate; inherited baseline run40468844319 is historical evidence and was not revalidated'
              echo '- Full unit suite: NOT RUN; inherited baseline run40468844319 is historical evidence and was not revalidated'
              echo '- Streaming cadence/process stress: NOT RUN; long-stream simulator baseline run40504021022-attempt2 is inherited; no new cadence measurement'
              echo '- Runtime issue unit scope: PASS (${{ steps.runtimeIssueTests.outputs.total_tests }} XCTest cases verified from the result bundle, including the retry, Stop, tab inventory, and transport diagnostic regressions)'
              echo '- UI scope: PASS (runtime issue summary and cached conversation navigation; 2 tests)'
            else
              echo '- Protocol Security / Fuzz: PASS'
            fi
            if [[ '${{ inputs.gate }}' == 'runtime-issues-device' || '${{ inputs.gate }}' == 'runtime-issues' || '${{ inputs.gate }}' == 'provider-observation' ]]; then
              :
            elif [[ '${{ inputs.gate }}' == 'web-controls' ]]; then
              echo '- Validation scope: Web controls; 2 targeted UI/navigation tests'
              echo '- Full unit and long-stream stress: NOT RERUN; unchanged baseline run39204233990'
            elif [[ '${{ inputs.gate }}' == 'copy-controls' ]]; then
              echo '- Validation scope: Copy controls; full unit and security suites, 2 UI/navigation tests'
              echo '- Long-stream stress: NOT RERUN; baseline run39204233990; physical copy/paste acceptance is separate'
            else
              echo '- Unit/UI: PASS'
            fi
            echo '- Device architecture: `arm64`'
            echo '- Bundle ID: `com.remoteai.mobile`'
            echo '- IPA: `${{ steps.ipa.outputs.name }}`'
            echo '- Artifact ID: `${{ steps.upload.outputs.artifact-id }}`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect bounded RemoteAI crash reports
        if: always() && inputs.gate != 'runtime-issues-device'
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil
          destination = pathlib.Path('build/unit-crashes')
          destination.mkdir(parents=True, exist_ok=True)
          reports = pathlib.Path.home() / 'Library/Logs/DiagnosticReports'
          selected = sorted((p for p in reports.glob('RemoteAI*') if p.is_file()),
                            key=lambda p: p.stat().st_mtime, reverse=True)[:10]
          manifest = []
          for source in selected:
              if source.stat().st_size > 20 * 1024 * 1024:
                  continue
              target = destination / source.name
              shutil.copyfile(source, target)
              manifest.append({'name': source.name, 'bytes': target.stat().st_size,
                               'sha256': hashlib.sha256(target.read_bytes()).hexdigest()})
          (destination / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          PY

      - name: Preserve test evidence
        if: always() && inputs.gate != 'runtime-issues-device'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UI-evidence
          path: |
            build/ui-evidence
            build/unit-tests.xcresult
            build/runtime-issues-tests.xcresult
            build/unit-crashes
            build/tests.log
            build/runtime-issues-tests.log
            build/runtime-issues-tests-summary.json
            build/runtime-issues-test-nodes.json
            build/unit-actor-isolation-probe.json
          retention-days: 7

  web-tab-race:
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'web-tab-race'
    uses: ./.github/workflows/diagnose-web-tab-race.yml
