name: RemoteAIMobile
options:
  bundleIdPrefix: com.remoteai
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 15.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
targets:
  RemoteAIMobile:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: RemoteAIMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remoteai.mobile
        PRODUCT_NAME: RemoteAI
        INFOPLIST_FILE: RemoteAIMobile/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        OTHER_LDFLAGS:
          - $(inherited)
          - -lsqlite3
    scheme:
      testTargets:
        - RemoteAIMobileTests
        - RemoteAIMobileUITests
      gatherCoverageData: true
  RemoteAIMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: RemoteAIMobileTests
    dependencies:
      - target: RemoteAIMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remoteai.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/RemoteAI.app/RemoteAI
        BUNDLE_LOADER: $(TEST_HOST)
  RemoteAIMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: RemoteAIMobileUITests
    dependencies:
      - target: RemoteAIMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remoteai.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RemoteAIMobile
